                - text: в декабре 2021 года среди более 1 000 компаний-клиентов за период с подключения сервиса по ноябрь 2021 года.
              - paragraph [ref=e1215]: Сервис выплат самозанятым предоставляется ООО «Джаст Лук».
              - paragraph [ref=e1216]: За оформление карты с дизайном банк может взимать плату, размер которой устанавливается банком и доводится до клиента до подачи заявки на выпуск либо перевыпуск карты в мобильном банке или интернет-банке. Плата взимается в дату подачи клиентом указанной заявки в рублях РФ или эквиваленте в валюте картсчета по курсу банка России на дату взимания платы. Плата не взимается при выпуске карты с дизайном при заключении договора расчетной карты, а также при перевыпуске карты с дизайном, ранее оформленной с таким же дизайном.
              - paragraph [ref=e1217]: Лимит бесплатных переводов до 3 700 000 ₽ доступен при подключении сервиса Premium и двух пакетов «Физлицам — без комиссии». Сумма складывается из переводов на кредитные и дебетовые карты Т-Банка
