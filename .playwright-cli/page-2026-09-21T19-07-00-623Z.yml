                - text: . При применении информационных технологий предоставления информации осуществляется сбор, систематизация и анализ сведений, относящихся к предпочтениям пользователей сети «Интернет», находящихся на территории Российской Федерации.
              - paragraph [ref=e1209]: Пример расчета условий носит исключительно информационный характер, а также не является публичной офертой.
