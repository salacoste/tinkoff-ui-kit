              - paragraph [ref=e1211]: Селлер — продавец на маркетплейсе.
              - paragraph [ref=e1212]: Сервис «Долями» предоставляется ООО «Т‑Покупки».
              - paragraph [ref=e1213]:
                - text: Рост среднего чека с рассрочками — до 40%. Источник —
                - link "исследование Тинькофф Кредит Брокера" [ref=e1214] [cursor=pointer]:
